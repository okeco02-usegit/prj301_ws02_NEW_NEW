<!DOCTYPE html>
<html>
    <head>
        <title>Sign Up</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <h2>Create new account (Sign Up)</h2>
        <form action="RegisterController" method="post">
            UserName: <input type="text" name="txtUserName" placeholder="Uxxx" required /><br/><br/>
            Password: <input type="password" name="txtPassword" required /><br/><br/>
            LastName: <input type="text" name="txtLastName" placeholder="Enter full name" required /><br/><br/>
            <input type="submit" value="Register" />
            <input type="reset" value="Reset"/>
            <a href="Login.html"><button type="button">Back to Login</button></a>
        </form>
    </body>
</html>
